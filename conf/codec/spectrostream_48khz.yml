# SpectroStream at 48 kHz: our reimplementation of
#   Li et al., "SpectroStream: A versatile neural codec for general audio", arXiv:2508.05207
# Architecture follows the paper; no public implementation exists.
#
# 64 RVQ levels of 1024 entries at 25 Hz. The bandwidth-extension experiments use
# the first 48 levels, i.e. 12 kbit/s.
# Trained for 500k steps (paper Sec. 2.2). ViSQOL 4.46 at 12 kbit/s.

# --- generator ------------------------------------------------------------
SpS.encoder_N_in_factors: [1,2,2,4,4,4,8,8]
SpS.encoder_N_out_factors: [2,2,4,4,4,8,8,8]
SpS.encoder_strides:
  - [2,1]
  - [2,1]
  - [3,1]
  - [2,1]
  - [2,1]
  - [2,2]
  - [1,2]
  - [1,1]
SpS.encoder_base_conv_depth: 32          # paper: C_e = 32
SpS.encoder_bottlneck_N_in_factor: 40
SpS.encoder_bottleneck_N_out_dim: 256    # paper: embedding dim 256
SpS.decoder_N_in_factors: [8,8,8,4,4,4,2,2]
SpS.decoder_N_out_factors: [8,8,4,4,4,2,2,1]
SpS.decoder_strides:
  - [1,1]
  - [1,2]
  - [2,2]
  - [2,1]
  - [2,1]
  - [3,1]
  - [2,1]
  - [2,1]
SpS.decoder_base_conv_depth: 64          # paper: C_d = 64
SpS.decoder_bottleneck_N_in_dim: 256
SpS.decoder_bottleneck_N_out_factor: 40
SpS.n_quantizers: 64
SpS.codebook_size: 1024
SpS.codebook_dim: 8
SpS.quantizer_l2_normalize: false
SpS.quantizer_dead_code_steps: 0
SpS.quantizer_dropout: 1.0               # paper Sec. 3.1.1
SpS.quantizer_bypass_prob: 0.5           # paper Sec. 3.1.2
SpS.use_checkpoint: true

# --- discriminator --------------------------------------------------------
Discriminator.N_in_factors: [1,2,4,4,8,8]
Discriminator.N_out_factors: [2,4,4,8,8,16]
Discriminator.strides:
  - [2,1]
  - [2,2]
  - [2,1]
  - [2,2]
  - [2,1]
  - [2,2]
Discriminator.base_conv_depth: 32        # paper: C_0 = 32
Discriminator.window_lengths: [128,256,512,1024,2048,4096]   # paper: K = 6 scales
Discriminator.use_checkpoint: true

# --- optimisation ---------------------------------------------------------
Adam.betas: [0.5, 0.9]
Adam.lr: 0.0001
ConstantLR.factor: 1.0
amp: false
compile_model: false
disc_loss_ema_decay: 0.99
disc_skip_below_loss: 0.0
lambdas:
  mel/loss: 1.0
  adv/feat_loss: 100.0
  adv/gen_loss: 1.0
  vq/commitment_loss: 1.0
  vq/codebook_loss: 1.0

# --- data -----------------------------------------------------------------
VolumeNorm.db: [const, -16]
build_transform.preprocess:
  - Identity
build_transform.augment_prob: 0.0
build_transform.augment:
  - Identity
build_transform.postprocess:
  - VolumeNorm
  - RescaleAudio
MultiScaleSTFTLoss.window_lengths: [2048, 512]
MelSpectrogramLoss.n_mels: 64
MelSpectrogramLoss.window_lengths: [64, 128, 256, 512, 1024, 2048]
MelSpectrogramLoss.mel_fmin: [0, 0, 0, 0, 0, 0]
MelSpectrogramLoss.mel_fmax: [null, null, null, null, null, null]
MelSpectrogramLoss.clamp_eps: 1.0e-5

device: cuda
num_iters: 500000
save_iters: [10000, 50000, 100000, 150000, 200000, 300000, 400000]
valid_freq: 1000
sample_freq: 1000
batch_size: 64                # 4 GPUs (torchrun); audiotools divides by world size
num_workers: 16
val_batch_size: 8
val_idx: [0, 1, 2, 3, 4, 5, 6, 7]
train/AudioDataset.duration: 1.28        # paper: 1.28 s training examples
train/AudioDataset.n_examples: 10000000
val/AudioDataset.duration: 5.0
val/build_transform.augment_prob: 1.0
val/AudioDataset.n_examples: 250
AudioLoader.shuffle: true
AudioDataset.without_replacement: true

# Point these at your own audio. Directories or .csv file lists (one path per
# line, header "path") both work; see scripts/build_filelists.py.
# The codecs in the paper are trained on Jamendo + the MUSDB18 training split.
train/build_dataset.folders:
  music_hq:
    - /path/to/musdb18/train/Mixtures
    - /path/to/jamendo/audio
val/build_dataset.folders:
  music_hq:
    - /path/to/musdb18/test/Mixtures
